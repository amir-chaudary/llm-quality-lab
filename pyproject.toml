[project]
name = "llm-quality-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.9.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "openai>=3.52.0",
    "pandas>=2.3.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.65.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
llm-quality-lab = "llm_quality_lab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.3.4",
    "langfuse>=4.18.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ragas>=0.3.1",
    "ruff>=0.17.5",
    "scikit-learn>=1.7.2",
]
